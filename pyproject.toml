[project]
name = "medops"
authors = [
    { name = "美妍伊人医疗科技有限公司" }
]
description = "Hospital Resource Planning platform built as one Frappe app with multiple modules"
requires-python = ">=3.10,<3.15"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
dev = [
    "bandit==1.9.4",
    "pip-audit==2.10.1",
    "pyyaml==6.0.3",
    "ruff==0.15.9",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=17.0.0-dev,<18.0.0"
erpnext = ">=17.0.0-dev,<18.0.0"
hrms = ">=17.0.0-dev,<18.0.0"

[tool.frappe.testing.function_type_validation]
max_module_depth = 1

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["apps", "build", "dist", "node_modules"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = ["E501", "W191", "RUF001"]
typing-modules = ["frappe.types.DF"]

[tool.ruff.lint.per-file-ignores]
"scripts/create_module.py" = ["E402"]
"scripts/environment_manager.py" = ["E402"]
"scripts/fixture_manager.py" = ["E402"]
"scripts/change_manager.py" = ["E402"]
"scripts/repository_contract.py" = ["E402"]
"scripts/security_supply_chain.py" = ["E402"]
"scripts/validate_package.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint.isort.sections]
frappe = ["frappe"]
erpnext = ["erpnext"]
hrms = ["hrms"]

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "frappe", "erpnext", "hrms", "first-party", "local-folder"]
