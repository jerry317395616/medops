name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"
  K6_VERSION: "2.1.0"
  K6_LINUX_AMD64_SHA256: "295d961ebfca306f295f1133068dcd403a8171c87f387928f5f30b0fbcff858a"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  GRYPE_VERSION: "0.116.1"
  GRYPE_LINUX_AMD64_SHA256: "0122df7b655981abe547ad3d2190d65551dac6a2bfc80b4dc2a989b5d0587458"
  CYCLONEDX_CLI_VERSION: "0.33.1"
  CYCLONEDX_CLI_LINUX_X64_SHA256: "bfc8b2538da86fe239bc53658bbb63c1c8c510a293c1e6891aa5bea5d3c58746"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install pinned quality dependencies
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          npm ci
      - name: Run repository, unit, type and frontend checks
        run: python scripts/quality.py
      - name: Validate pinned k6 performance script
        run: |
          archive="$RUNNER_TEMP/k6-v${K6_VERSION}-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/grafana/k6/releases/download/v${K6_VERSION}/k6-v${K6_VERSION}-linux-amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$K6_LINUX_AMD64_SHA256" "$archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          "$RUNNER_TEMP/k6-v${K6_VERSION}-linux-amd64/k6" version \
            | grep --fixed-strings "v${K6_VERSION}"
          "$RUNNER_TEMP/k6-v${K6_VERSION}-linux-amd64/k6" inspect \
            medops/load_tests/performance_baseline.js
      - name: Validate governed Git change
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          if [[ -n "$CHANGE_BASE" && ! "$CHANGE_BASE" =~ ^0+$ ]]; then
            python scripts/change_manager.py check \
              --base-ref "$CHANGE_BASE" \
              --correlation-id "CI-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          else
            python scripts/change_manager.py validate
          fi

  security:
    name: Security
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Verify complete repository history
        run: |
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            git fetch --force --prune --tags --unshallow
          else
            git fetch --force --prune --tags
          fi
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install pinned scanner dependencies
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          npm install --global "npm@11.17.0"
          npm ci
      - name: Download and verify pinned security binaries
        run: |
          tools="$RUNNER_TEMP/ione-security-tools"
          mkdir --parents "$tools"
          gitleaks_archive="$tools/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          grype_archive="$tools/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          cyclonedx_binary="$tools/cyclonedx-linux-x64"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$gitleaks_archive"
          curl --fail --location --silent --show-error \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz" \
            --output "$grype_archive"
          curl --fail --location --silent --show-error \
            "https://github.com/CycloneDX/cyclonedx-cli/releases/download/v${CYCLONEDX_CLI_VERSION}/cyclonedx-linux-x64" \
            --output "$cyclonedx_binary"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$gitleaks_archive" \
            | sha256sum --check
          printf '%s  %s\n' "$GRYPE_LINUX_AMD64_SHA256" "$grype_archive" \
            | sha256sum --check
          printf '%s  %s\n' "$CYCLONEDX_CLI_LINUX_X64_SHA256" "$cyclonedx_binary" \
            | sha256sum --check
          tar --extract --gzip --file "$gitleaks_archive" --directory "$tools" gitleaks
          tar --extract --gzip --file "$grype_archive" --directory "$tools" grype
          chmod 0755 "$tools/gitleaks" "$tools/grype" "$cyclonedx_binary"
      - name: Generate SBOM and enforce security gates
        run: |
          tools="$RUNNER_TEMP/ione-security-tools"
          python scripts/security_supply_chain.py run \
            --source-commit "$GITHUB_SHA" \
            --npm-bin npm \
            --gitleaks-bin "$tools/gitleaks" \
            --grype-bin "$tools/grype" \
            --cyclonedx-bin "$tools/cyclonedx-linux-x64"
      - name: Upload governed security evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: security-evidence-${{ github.run_id }}
          path: |
            .artifacts/security/medops.cdx.json
            .artifacts/security/security-summary.json
            .artifacts/security/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  integration:
    name: Integration
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=12
          --tmpfs=/var/lib/mysql:rw,noexec,nosuid,size=2g
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes mariadb-client libmariadb-dev pkg-config redis-server
          uv tool install git+https://github.com/jerry317395616/bench@f21f11793872705560e710b2bda69934c9c34011
      - name: Build locked Bench and run medops tests
        env:
          ADMIN_PASSWORD: ci_admin_password
          BENCH_DIR: ${{ runner.temp }}/frappe-bench
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_ROOT_PASSWORD: ci_root_password
          DB_ROOT_USERNAME: root
          PYTHON_BIN: python3.14
          SITE_NAME: hrp-test.localhost
        run: bash scripts/ci_integration.sh
      - name: Upload integration logs on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: integration-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/frappe-bench/logs
          if-no-files-found: ignore
          retention-days: 7

  integration-core:
    name: Integration with IONE Core
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=12
          --tmpfs=/var/lib/mysql:rw,noexec,nosuid,size=2g
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes mariadb-client libmariadb-dev pkg-config redis-server
          uv tool install git+https://github.com/jerry317395616/bench@f21f11793872705560e710b2bda69934c9c34011
      - name: Build locked Bench and run medops tests
        env:
          ADMIN_PASSWORD: ci_admin_password
          BENCH_DIR: ${{ runner.temp }}/frappe-bench
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_ROOT_PASSWORD: ci_root_password
          DB_ROOT_USERNAME: root
          PYTHON_BIN: python3.14
          SITE_NAME: hrp-test.localhost
          INCLUDE_IONE_CORE: "1"
        run: bash scripts/ci_integration.sh
      - name: Upload integration logs on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: integration-core-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/frappe-bench/logs
          if-no-files-found: ignore
          retention-days: 7

  required:
    name: Required
    if: always()
    needs:
      - quality
      - security
      - integration
      - integration-core
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce required job results
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          INTEGRATION_CORE_RESULT: ${{ needs.integration-core.result }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          results = {
              "quality": os.environ["QUALITY_RESULT"],
              "security": os.environ["SECURITY_RESULT"],
              "integration": os.environ["INTEGRATION_RESULT"],
              "integration_core": os.environ["INTEGRATION_CORE_RESULT"],
          }
          print(json.dumps(results, sort_keys=True))
          if any(result != "success" for result in results.values()):
              sys.exit(1)
          PY
