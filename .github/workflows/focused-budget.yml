name: Focused Budget Integration (non-gating)

on:
  push:
    branches:
      - "cod/focused-budget-*"

permissions:
  contents: read

concurrency:
  group: focused-budget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  budget-focused:
    name: Native posted recovery Desk (Core ${{ matrix.include_core }}, not Required)
    strategy:
      fail-fast: false
      matrix:
        include_core: ["0", "1"]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=12
          --tmpfs=/var/lib/mysql:rw,noexec,nosuid,size=2g
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes mariadb-client libmariadb-dev pkg-config redis-server
          uv tool install git+https://github.com/jerry317395616/bench@f21f11793872705560e710b2bda69934c9c34011
      - name: Run focused budget tests on an isolated site
        env:
          INCLUDE_IONE_CORE: ${{ matrix.include_core }}
          ADMIN_PASSWORD: ci_admin_password
          BENCH_DIR: ${{ runner.temp }}/focused-frappe-bench
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_ROOT_PASSWORD: ci_root_password
          DB_ROOT_USERNAME: root
          PYTHON_BIN: python3.14
          SITE_NAME: hrp-focused.localhost
        run: bash scripts/ci_budget_focused.sh

      - name: Upload native Desk evidence without credentials
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-recovery-core-${{ matrix.include_core }}
          path: ${{ runner.temp }}/native-reservation-desk-evidence
          if-no-files-found: ignore
          retention-days: 7
