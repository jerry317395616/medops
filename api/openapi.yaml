        posting_date:
          type: string
          format: date
        total_amount:
          type: string
          pattern: ^-?(0|[1-9][0-9]{0,14})(\.[0-9]{1,9})?$
        currency:
          type: string
          minLength: 1
          maxLength: 140
        line_count:
