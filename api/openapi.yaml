components:
  headers:
    CorrelationId:
      description: Identifier propagated across related HTTP and background executions.
      schema:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,139}$
    RequestId:
      description: Unique identifier for this HTTP request or background execution.
      schema:
        type: string
        pattern: ^req-[A-Za-z0-9]{20}$
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: sid
      description: Authenticated Frappe browser session; mutations require CSRF and
        reject Authorization headers.
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: token api_key:api_secret or OAuth2 bearer
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 140
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,139}$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 140
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]{7,139}$
  schemas:
    BudgetReleaseAcknowledgement:
      type: object
      additionalProperties: false
      required:
      - doctype
      - name
      - revision
      - operation
      - status
      - idempotency_replayed
      - correlation_id
      - request_id
      properties:
        doctype:
          type: string
          const: HRP Budget Release
        name:
          type: string
          pattern: ^[0-9a-f]{64}$
        revision:
          type: integer
          minimum: 1
        operation:
          type: string
          enum:
          - Release
          - Reverse
        status:
          type: string
          enum:
          - Prepared
          - Authorized
          - Posted
        idempotency_replayed:
          type: boolean
        correlation_id:
          type: string
          minLength: 1
          maxLength: 140
        request_id:
          type: string
          minLength: 1
          maxLength: 140
    BudgetReleaseAuthorizationAcknowledgement:
      type: object
      additionalProperties: false
      required:
      - doctype
      - name
      - revision
      - operation
      - status
      - idempotency_replayed
      - correlation_id
      - request_id
      - decision
      properties:
        doctype:
          type: string
          const: HRP Budget Release
        name:
          type: string
          pattern: ^[0-9a-f]{64}$
        revision:
          type: integer
          minimum: 1
        operation:
          type: string
          enum:
          - Release
          - Reverse
        status:
          type: string
          enum:
          - Prepared
          - Authorized
          - Posted
        idempotency_replayed:
          type: boolean
        correlation_id:
          type: string
          minLength: 1
          maxLength: 140
        request_id:
          type: string
          minLength: 1
          maxLength: 140
        decision:
          type: string
          minLength: 1
          maxLength: 140
    BudgetReleaseCommand:
      type: object
      additionalProperties: false
      required:
      - approval_case
      - expected_approval_revision
      - posting_date
      - reason
      properties:
        approval_case:
          type: string
          minLength: 1
          maxLength: 140
        expected_approval_revision:
          type: integer
          minimum: 2
        posting_date:
          type: string
          format: date
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    BudgetReleaseRevisionCommand:
      type: object
      additionalProperties: false
      required:
      - release
      - expected_revision
      - posting_date
      - reason
      properties:
        release:
          type: string
          minLength: 1
          maxLength: 140
        expected_revision:
          type: integer
          minimum: 1
        posting_date:
          type: string
          format: date
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    BudgetReleasePreviewCommand:
