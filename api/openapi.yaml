components:
  headers:
    CorrelationId:
      description: Identifier propagated across related HTTP and background executions.
      schema:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,139}$
    RequestId:
      description: Unique identifier for this HTTP request or background execution.
      schema:
        type: string
        pattern: ^req-[A-Za-z0-9]{20}$
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: token api_key:api_secret or OAuth2 bearer
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 140
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,139}$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 140
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]{7,139}$
  schemas:
    FrappeResponse:
      type: object
      properties:
        message: {}
        correlation_id:
          type: string
        warnings:
          type: array
          items:
            type: string
    SegregationValidationFrappeResponse:
      type: object
      additionalProperties: false
      required:
      - message
      properties:
        message:
          $ref: '#/components/schemas/SegregationValidationResult'
    SegregationValidationResult:
      type: object
      additionalProperties: false
      required:
      - schema_version
      - action
      - allowed
      - rules_evaluated
      - conflicts
      - decision_digest
      - correlation_id
      - request_id
      - idempotency_replayed
      properties:
        schema_version:
          type: integer
          const: 1
        action:
          type: string
          enum:
          - amend
          - approve
          - cancel
          - create
          - pay
          - post
          - reconcile
          - release
          - review
          - submit
        allowed:
          type: boolean
        rules_evaluated:
          type: integer
          minimum: 0
          maximum: 100
        conflicts:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/SegregationConflict'
        decision_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Binds the subject and document context, the redacted decision, and every evaluated rule name, revision and policy digest.
        correlation_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,139}$
        request_id:
          type: string
          pattern: ^req-[A-Za-z0-9]{20}$
        idempotency_replayed:
          type: boolean
          const: false
          description: Compatibility field that is always false because authorization decisions are evaluated live.
    SegregationConflict:
      oneOf:
      - $ref: '#/components/schemas/SegregationRuleConflict'
      - $ref: '#/components/schemas/SegregationNoApplicableRuleConflict'
    SegregationRuleConflict:
      type: object
      additionalProperties: false
      required:
      - rule
      - code
      - revision
      - policy_digest
      - reason
      - matched_actor_fields
      - matched_roles
      properties:
        rule:
          type: string
          minLength: 1
          maxLength: 140
        code:
          type: string
          minLength: 1
          maxLength: 140
        revision:
          type: integer
          minimum: 1
        policy_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
        reason:
          type: string
          enum:
          - ACTOR_AND_ROLE
          - ACTOR_REUSE
          - INCOMPATIBLE_ROLE
