      - subject
      - company
      - hospital
      - organization_version
      - organization_unit
      - fiscal_year
      - currency
      - currency_precision
      - amount_schema_version
      - total_amount
      - line_count
      - source_submission
      - source_approval
      - source_approval_revision
      - posting_date
      - reason
      - prepared_by
      - prepared_at
      - status
      - revision
      - authorized_by
      - authorized_at
      - authorization_decision
      - posted_at
      - ledger_count
      - reversal_of
      properties:
        name:
          type: string
          pattern: ^[0-9a-f]{64}$
        operation:
          type: string
          enum:
          - Release
          - Reverse
        subject:
          type:
          - string
          - 'null'
          maxLength: 140
        company:
          type:
          - string
          - 'null'
          maxLength: 140
        hospital:
          type:
          - string
          - 'null'
          maxLength: 140
        organization_version:
          type:
          - string
          - 'null'
          maxLength: 140
        organization_unit:
          type:
          - string
          - 'null'
          maxLength: 140
        fiscal_year:
          type:
          - string
          - 'null'
          maxLength: 140
        currency:
          type:
          - string
          - 'null'
          maxLength: 140
        currency_precision:
          type: integer
          minimum: 0
          maximum: 9
        amount_schema_version:
          type: integer
          const: 2
        total_amount:
          type: string
          pattern: ^-?(0|[1-9][0-9]{0,14})(\.[0-9]{1,9})?$
        line_count:
          type: integer
          minimum: 1
          maximum: 50000
        source_submission:
          type:
          - string
          - 'null'
          maxLength: 140
        source_approval:
          type:
          - string
          - 'null'
          maxLength: 140
        source_approval_revision:
          type: integer
          minimum: 2
        posting_date:
          type: string
          format: date
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        prepared_by:
          type:
          - string
          - 'null'
          maxLength: 140
        prepared_at:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - Prepared
          - Authorized
          - Posted
        revision:
          type: integer
          minimum: 1
        authorized_by:
          type:
          - string
          - 'null'
          maxLength: 140
        authorized_at:
          type:
          - string
          - 'null'
        authorization_decision:
          type:
          - string
          - 'null'
          maxLength: 140
        posted_at:
          type:
          - string
          - 'null'
        ledger_count:
          type: integer
          minimum: 0
          maximum: 50000
        reversal_of:
          type:
          - string
          - 'null'
          maxLength: 140
    FrappeResponse:
      type: object
      properties:
        message: {}
        correlation_id:
          type: string
        warnings:
          type: array
          items:
            type: string
    SegregationValidationFrappeResponse:
      type: object
      additionalProperties: false
      required:
      - message
      properties:
        message:
          $ref: '#/components/schemas/SegregationValidationResult'
    SegregationValidationResult:
      type: object
      additionalProperties: false
      required:
      - schema_version
      - action
      - allowed
      - rules_evaluated
      - conflicts
      - decision_digest
      - correlation_id
      - request_id
      - idempotency_replayed
      properties:
        schema_version:
          type: integer
          const: 1
        action:
          type: string
          enum:
          - amend
          - approve
          - cancel
          - create
          - pay
          - post
          - reconcile
          - release
          - review
          - submit
        allowed:
          type: boolean
        rules_evaluated:
          type: integer
          minimum: 0
          maximum: 100
        conflicts:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/SegregationConflict'
        decision_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Binds the subject and document context, the redacted decision,
            and every evaluated rule name, revision and policy digest.
        correlation_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,139}$
        request_id:
          type: string
          pattern: ^req-[A-Za-z0-9]{20}$
        idempotency_replayed:
          type: boolean
          const: false
          description: Compatibility field that is always false because authorization
            decisions are evaluated live.
    SegregationConflict:
      oneOf:
      - $ref: '#/components/schemas/SegregationRuleConflict'
      - $ref: '#/components/schemas/SegregationNoApplicableRuleConflict'
    SegregationRuleConflict:
      type: object
      additionalProperties: false
      required:
      - rule
      - code
      - revision
      - policy_digest
      - reason
      - matched_actor_fields
      - matched_roles
      properties:
        rule:
          type: string
          minLength: 1
          maxLength: 140
        code:
          type: string
          minLength: 1
          maxLength: 140
        revision:
          type: integer
          minimum: 1
        policy_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
        reason:
          type: string
          enum:
          - ACTOR_AND_ROLE
          - ACTOR_REUSE
          - INCOMPATIBLE_ROLE
        matched_actor_fields:
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-z][a-z0-9_]{0,63}$
        matched_roles:
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 140
    SegregationNoApplicableRuleConflict:
      type: object
      additionalProperties: false
      required:
      - rule
      - code
      - reason
      - matched_actor_fields
      - matched_roles
      properties:
        rule:
          type: 'null'
        code:
          type: string
          const: NO_APPLICABLE_RULE
        reason:
