      - proof
      - expires_at
      - release
      - release_revision
      - action
      - reason
      - posting_date
      - total_amount
      - currency
      - line_count
      - intent_digest
      - idempotency_replayed
      - correlation_id
      - request_id
      properties:
        confirmation:
          type: string
          minLength: 1
          maxLength: 140
        proof:
          type: string
          pattern: ^[A-Za-z0-9_-]{32,128}$
          description: Keep only in page memory; short-lived current actor and SID proof.
        expires_at:
          type: string
        release:
          type: string
          pattern: ^[0-9a-f]{64}$
        release_revision:
          type: integer
          minimum: 1
        action:
