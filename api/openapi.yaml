openapi: 3.1.0
info:
  title: 美妍伊人医院HRP API
  version: 3.0.0
  description: Frappe v17 based Hospital Resource Planning API contract.
servers:
- url: https://{host}
  variables:
    host:
      default: hrp.example.com
paths:
  /api/method/medops.api.v1.environment.get_environment_status:
    get:
      operationId: platform_010
      summary: 查询当前非生产环境安全配置
      tags:
      - medops
      security:
      - tokenAuth: []
      responses:
        '200':
          description: Environment profile status without secrets or server paths
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrappeResponse'
        '401':
          description: Authentication required
        '500':
          description: Environment configuration invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
      x-required-role: Authenticated User
      x-transaction-boundary: Read-only
      x-idempotency: Not applicable
  /api/method/medops.api.v1.fixtures.get_fixture_governance_status:
    get:
      operationId: platform_011
      summary: 查询 Fixtures 导出治理状态
      tags:
      - medops
      security:
      - tokenAuth: []
      responses:
        '200':
          description: Redacted fixture policy and repository status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrappeResponse'
        '401':
          description: Authentication required
        '403':
          description: System Manager role required
        '500':
          description: Fixture policy or repository validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
      x-required-role: System Manager
      x-transaction-boundary: Read-only
      x-idempotency: Not applicable
  /api/method/medops.api.v1.change_governance.get_change_governance_status:
    get:
      operationId: platform_012
      summary: 查询 ADR 与变更治理状态
      tags:
      - medops
      security:
      - tokenAuth: []
      parameters:
      - name: correlation_id
        in: query
        required: false
        schema:
          type: string
          maxLength: 140
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          maxLength: 140
      responses:
        '200':
          description: Redacted deterministic ADR and change-governance status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrappeResponse'
        '401':
          description: Authentication required
        '403':
          description: System Manager or HRP System Manager role required
        '400':
          description: Invalid correlation identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
        '500':
          description: ADR, change record or repository governance validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
      x-required-role: System Manager or HRP System Manager
      x-transaction-boundary: Read-only
      x-idempotency: Read-only deterministic
  /api/method/medops.api.v1.errors.get_error_catalog:
    get:
      operationId: platform_013
      summary: 查询统一错误码目录
      tags:
      - medops
      security:
      - tokenAuth: []
      responses:
        '200':
          description: Stable translated I-ONE error catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrappeResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
        '403':
          description: System Manager or HRP System Manager role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
        '500':
          description: Error catalog or translations are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
      x-required-role: System Manager or HRP System Manager
      x-transaction-boundary: Read-only
      x-idempotency: Read-only deterministic
  /api/method/medops.api.v1.audit.get_audit_context:
    get:
      operationId: platform_014
      summary: 查询当前请求的审计上下文
      tags:
      - medops
      security:
      - tokenAuth: []
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 140
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,139}$
      responses:
        '200':
          description: Safe request-scoped identifiers without actor or request payload
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditContextResponse'
        '400':
          description: Invalid correlation identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
      x-required-role: Authenticated User
      x-transaction-boundary: Read-only
      x-idempotency: Read-only per request
  /api/method/medops.api.v1.ledgers.get_immutable_ledger_contract:
    get:
      operationId: platform_015
      summary: 查询不可变台账公共契约
      tags:
      - medops
      security:
      - tokenAuth: []
      responses:
        '200':
          description: Shared append-only and equal-and-opposite reversal contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImmutableLedgerContractResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
        '403':
          description: System Manager or HRP System Manager role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
        '500':
          description: Immutable ledger platform contract is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
      x-required-role: System Manager or HRP System Manager
      x-transaction-boundary: Read-only
      x-idempotency: Read-only deterministic
  /api/method/medops.api.v1.messages.get_transactional_message_contract:
    get:
      operationId: platform_016
      summary: 查询 Outbox / Inbox 事务消息公共契约
      tags:
      - medops
      security:
      - tokenAuth: []
      responses:
        '200':
          description: Shared transactional Outbox, Inbox deduplication and lease contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionalMessageContractResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
        '403':
          description: System Manager or HRP System Manager role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
        '500':
          description: Transactional message platform contract is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
      x-required-role: System Manager or HRP System Manager
      x-transaction-boundary: Read-only
      x-idempotency: Read-only deterministic
  /api/method/medops.api.v1.test_data.get_test_data_factory_contract:
    get:
      operationId: platform_017
      summary: 查询测试数据工厂公共契约
      tags:
      - medops
      security:
      - tokenAuth: []
      responses:
        '200':
          description: Source-controlled synthetic scenarios and non-production safety policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestDataFactoryContractResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
        '403':
          description: System Manager or HRP System Manager role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
        '500':
          description: Test-data scenario registry or environment configuration is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
      x-required-role: System Manager or HRP System Manager
      x-transaction-boundary: Read-only
      x-idempotency: Read-only deterministic
  /api/method/medops.api.v1.performance.get_performance_baseline_contract:
    get:
      operationId: platform_018
      summary: 查询性能基线与非生产压测许可契约
      tags:
      - medops
      security:
      - tokenAuth: []
      responses:
        '200':
          description: Source-controlled read-only scenarios, thresholds and environment gate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceBaselineContractResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
        '403':
          description: System Manager or HRP System Manager role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
        '500':
          description: Performance registry or managed environment configuration is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
      x-required-role: System Manager or HRP System Manager
      x-transaction-boundary: Read-only
      x-idempotency: Read-only deterministic
  /api/method/medops.api.v1.security.get_software_supply_chain_contract:
    get:
      operationId: platform_019
      summary: 查询软件供应链安全与SBOM治理契约
      tags:
      - medops
      security:
      - tokenAuth: []
      responses:
        '200':
          description: Source-controlled read-only software supply chain policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoftwareSupplyChainContractResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
        '403':
          description: System Manager or HRP System Manager role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
        '500':
          description: Software supply chain policy is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
      x-required-role: System Manager or HRP System Manager
      x-transaction-boundary: Read-only
      x-idempotency: Read-only deterministic
  /api/method/medops.api.v1.settings.get_system_settings:
    get:
      operationId: platform_020
      summary: 查询HRP系统设置
      tags:
      - medops
      security:
      - tokenAuth: []
      responses:
        '200':
          description: Current explicit HRP system settings without arbitrary configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettingsFrappeResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
        '403':
          description: System Manager or HRP System Manager role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
        '500':
          description: Persisted system settings are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
      x-required-role: System Manager or HRP System Manager
      x-transaction-boundary: Read-only
      x-idempotency: Read-only deterministic
  /api/method/medops.api.v1.settings.update_system_settings:
    post:
      operationId: platform_021
      summary: 更新HRP系统设置
      tags:
      - medops
      security:
      - tokenAuth: []
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 140
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,139}$
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 140
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - enabled
              - integration_timeout_seconds
              - expected_version
              properties:
                enabled:
                  oneOf:
                  - type: boolean
                  - type: integer
                    enum:
                    - 0
                    - 1
                  - type: string
                    enum:
                    - '0'
                    - '1'
                default_company:
                  type:
                  - string
                  - 'null'
                  maxLength: 140
                default_hospital:
                  type:
                  - string
                  - 'null'
                  maxLength: 140
                integration_timeout_seconds:
                  oneOf:
                  - type: integer
                    minimum: 5
                    maximum: 300
                  - type: string
                    pattern: ^[0-9]+$
                remarks:
                  type:
                  - string
                  - 'null'
                  maxLength: 500
                expected_version:
                  oneOf:
                  - type: integer
                    minimum: 1
                  - type: string
                    pattern: ^[0-9]+$
                correlation_id:
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  maxLength: 140
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,139}$
      responses:
        '200':
          description: Updated or idempotently replayed system settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettingsUpdateFrappeResponse'
        '400':
          description: Invalid request or missing idempotency key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
        '403':
          description: System Manager or HRP System Manager role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
        '404':
          description: Default company was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
        '409':
          description: Configuration version or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
        '500':
          description: Persisted system settings are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
      x-required-role: System Manager or HRP System Manager
      x-transaction-boundary: Single DB transaction
      x-idempotency: Required for write
  /api/method/medops.api.v1.modules.set_module_enabled:
    post:
      operationId: platform_009
      summary: Enable or disable a published HRP module
      tags:
      - medops
      security:
      - tokenAuth: []
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 140
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,139}$
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 140
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - module_name
              - enabled
              properties:
                module_name:
                  type: string
                  minLength: 1
                  maxLength: 140
                enabled:
                  oneOf:
                  - type: boolean
                  - type: integer
                    enum:
                    - 0
                    - 1
                  - type: string
                    enum:
                    - '0'
                    - '1'
                correlation_id:
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  maxLength: 140
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,139}$
      responses:
        '200':
          description: Module state changed or a completed response was replayed
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleEnabledFrappeResponse'
        '400':
          description: Invalid request or missing idempotency key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
        '403':
          description: Module administration role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
        '404':
          description: Module not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
        '409':
          description: Idempotency key conflict or operation still in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
        '500':
          description: Internal or idempotency snapshot error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
      x-required-role: System Manager or HRP System Manager
      x-transaction-boundary: Single DB transaction owned by the request
      x-idempotency: Required for write; encrypted response snapshot
  /api/method/medops.api.v1.core.scope.resolve:
    post:
      operationId: core_001
      summary: 解析当前用户组织/数据权限
      tags:
      - medops
      security:
      - tokenAuth: []
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrappeResponse'
        '403':
          description: Forbidden
        '422':
          description: Business validation error
        '500':
          description: Internal error
      x-required-role: Authenticated User
      x-transaction-boundary: Read-only request
      x-idempotency: Not required (read-only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: user,doctype,action
              additionalProperties: true
  /api/method/medops.api.v1.core.approval.evaluate:
    post:
      operationId: core_002
      summary: 按真实单据上下文确定性解析动态审批链
      tags:
      - medops
      security:
      - tokenAuth: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: 确定性审批决策
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrappeResponse'
        '400':
          description: Invalid approval context
        '401':
          description: Authentication required
        '403':
          description: Approval role or organization scope required
        '404':
          description: Document or approval matrix not found
        '409':
          description: Document context conflict
        '500':
          description: Internal error
      x-required-role: System Manager or HRP System Manager or HRP User or HRP Auditor or HRP Integration User
      x-transaction-boundary: Read-only
      x-idempotency: Read-only deterministic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - doctype
              - docname
              - amount
              - dimensions
              properties:
                doctype:
                  type: string
                  maxLength: 140
                docname:
                  type: string
                  maxLength: 140
                amount:
                  oneOf:
                  - type: number
                    minimum: 0
                  - type: string
                dimensions:
                  oneOf:
                  - type: object
                    maxProperties: 16
                    additionalProperties:
                      type: string
                  - type: string
                    maxLength: 16384
  /api/method/medops.api.v1.core.approval.upsert:
    post:
      operationId: core_028
      summary: 创建或修订受控审批矩阵
      tags:
      - medops
      security:
      - tokenAuth: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 审批矩阵已创建、修订或幂等重放
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrappeResponse'
        '400':
          description: Invalid request or missing idempotency key
        '401':
          description: Authentication required
        '403':
          description: Approval matrix administrator role required
        '404':
          description: Referenced organization resource not found
        '409':
          description: Revision or identity conflict
        '500':
          description: Persisted approval configuration is invalid
      x-required-role: System Manager or HRP System Manager
      x-transaction-boundary: Single DB transaction
      x-idempotency: Required for write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - code
              - display_name
              - target_doctype
              - company
              - hospital
              - valid_from
              - steps
              properties:
                code:
                  type: string
                  pattern: ^[A-Z][A-Z0-9_-]{0,63}$
                display_name:
                  type: string
                  maxLength: 140
                target_doctype:
                  type: string
                  maxLength: 140
                company:
                  type: string
                  maxLength: 140
                hospital:
                  type: string
                  maxLength: 140
                organization_unit:
                  type: string
                  maxLength: 140
                include_descendants:
                  type: boolean
                priority:
                  type: integer
                  minimum: 0
                  maximum: 9999
                dimensions:
                  type: object
                  maxProperties: 16
                  additionalProperties:
                    type: string
                enabled:
                  type: boolean
                valid_from:
                  type: string
                  format: date
                valid_to:
                  type: string
                  format: date
                expected_revision:
                  type: integer
                  minimum: 0
                matrix_name:
                  type: string
                  maxLength: 140
                remarks:
                  type: string
                steps:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - sequence_no
                    - step_name
                    - threshold_amount
                    - approver_type
                    properties:
                      sequence_no:
                        type: integer
                        minimum: 1
                      step_name:
                        type: string
                        maxLength: 140
                      threshold_amount:
                        type: number
                        minimum: 0
                      approver_type:
                        type: string
                        enum:
                        - Role
                        - User
                      approver_role:
                        type: string
                        maxLength: 140
                      approver_user:
                        type: string
                        maxLength: 140
                      approval_mode:
                        type: string
                        enum:
                        - All
                        - Any
                      description:
                        type: string
  /api/method/medops.api.v1.core.approval.get:
    get:
      operationId: core_029
      summary: 查询审批矩阵定义
      tags:
      - medops
      security:
      - tokenAuth: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: matrix_name
        in: query
        required: true
        schema:
          type: string
          maxLength: 140
      responses:
        '200':
          description: 审批矩阵定义
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrappeResponse'
        '401':
          description: Authentication required
        '403':
          description: Approval matrix read role required
        '404':
          description: Approval matrix not found
        '500':
          description: Persisted approval configuration is invalid
      x-required-role: System Manager or HRP System Manager or HRP Auditor
      x-transaction-boundary: Read-only
      x-idempotency: Read-only deterministic
  /api/method/medops.api.v1.core.sod.validate:
    post:
      operationId: core_003
      summary: 按真实单据实时校验不相容职责
      tags:
      - medops
      security:
      - tokenAuth: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Live, deterministic and redacted segregation decision; never replayed from an idempotency snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegregationValidationFrappeResponse'
        '400':
          description: Invalid request or correlation identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
        '401':
