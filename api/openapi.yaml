      - app
      - sha256
      - sbom
      - execution_policy
      - tools
      - gates
      - exception_count
      - exceptions
      - idempotency
      - scan_available_from_site
      - artifact_storage
      properties:
        status:
          type: string
          const: ok
        schema_version:
          type: integer
          const: 1
        app:
          type: string
          const: medops
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        sbom:
          type: object
          additionalProperties: false
          required:
          - format
          - spec_version
          - artifact_name
          - include_development_dependencies
          - contains_personal_data
          - required_components
          properties:
            format:
              type: string
              const: CycloneDX JSON
            spec_version:
              type: string
              const: '1.7'
            artifact_name:
              type: string
              const: medops.cdx.json
            include_development_dependencies:
              type: boolean
              const: true
            contains_personal_data:
              type: boolean
              const: false
            required_components:
              type: array
              minItems: 4
              uniqueItems: true
              items:
                type: string
                enum:
                - medops
                - frappe
                - erpnext
                - hrms
        execution_policy:
          type: object
          additionalProperties: false
          required:
          - http_write_enabled
          - site_execution_enabled
          - production_execution_enabled
          - artifact_directory
          - artifact_retention_days
          - subprocess_environment_allowlist
          - execution_location
          properties:
            http_write_enabled:
              type: boolean
              const: false
            site_execution_enabled:
              type: boolean
              const: false
            production_execution_enabled:
              type: boolean
              const: false
            artifact_directory:
              type: string
              const: .artifacts/security
            artifact_retention_days:
              type: integer
              minimum: 1
            subprocess_environment_allowlist:
              type: array
              uniqueItems: true
              items:
                type: string
            execution_location:
              type: string
              const: external_ci_or_release_process
        tools:
          type: array
          minItems: 6
          uniqueItems: true
          items:
            type: object
            required:
            - name
            - version
            properties:
              name:
                type: string
              version:
                type: string
              linux_asset:
                type: string
              linux_sha256:
                type: string
                pattern: ^[0-9a-f]{64}$
        gates:
          type: object
          additionalProperties: true
        exception_count:
          type: integer
          minimum: 0
        exceptions:
          type: array
