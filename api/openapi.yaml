            type: object
            additionalProperties: false
            required:
            - kind
            - id
            - package
            - expires_on
            - reason
            - approved_by
            properties:
              kind:
                type: string
              id:
                type: string
              package:
                type: string
              expires_on:
                type: string
                format: date
              reason:
                type: string
              approved_by:
                type: string
        idempotency:
          type: string
          const: read_only_replay_safe
        scan_available_from_site:
          type: boolean
          const: false
        artifact_storage:
          type: string
          const: ci_or_release_artifact
